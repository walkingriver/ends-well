<mat-card class="series-card">
  <div
    class="card-image"
    [style.backgroundImage]="'url(' + series.posterPath + ')'"
    role="img"
    [attr.aria-label]="series.title + ' poster'"
  ></div>
  <mat-card-content>
    <h3>
      <a [routerLink]="['/series', series.id]" class="title-link">{{ series.title }}</a>
    </h3>
    <div class="series-meta">
      <span class="year">{{ series.yearStarted }}–{{ series.yearEnded }}</span>
      <div class="rating">
        <mat-icon aria-hidden="true">star</mat-icon>
        <span>{{ series.averageRating }}</span>
      </div>
    </div>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button color="primary" [routerLink]="['/series', series.id]">
      View Details
    </button>
  </mat-card-actions>
</mat-card>
